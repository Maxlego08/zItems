# Pipeline Effect Example
# MINING replaces the old unfiltered BLOCK_BREAK entry entirely — an empty/absent
# `materials` list already matches any block, so there's never a need for both.
# Each entry is a BlockMatch wrapper (mirrors IngredientWrapper's shape) whose
# `block` field is a plain vanilla name or a "provider:id" custom block reference
# (ItemsAdder, Nexo, Oraxen).
id: "ore_mining"
type: "PIPELINE"
display-name: "<gradient:#8e44ad:#3498db><bold>⛏ ORE MINING PIPELINE</bold></gradient>"
entry:
  type: "MINING"
  materials:
    - block: "DIAMOND_ORE"
    - block: "DEEPSLATE_DIAMOND_ORE"
    - block: "itemsadder:ruby_ore"
steps:
  - "xp_boost_pickaxe"
